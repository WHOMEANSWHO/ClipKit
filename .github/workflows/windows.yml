name: Windows build & test

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke test - detect
        run: python clipkit.py --detect

      - name: Smoke test - write a ClipKit profile (dry run)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "clipkit-dryrun"
          python clipkit.py --dry-run "$dir"
          $required = @(
            "basic\profiles\ClipKit\basic.ini",
            "basic\scenes\ClipKit.json",
            "user.ini"
          )
          foreach ($rel in $required) {
            $p = Join-Path $dir $rel
            if (-not (Test-Path $p)) { throw "Missing expected profile file: $p" }
          }
          $scene = Get-Content (Join-Path $dir "basic\scenes\ClipKit.json") -Raw | ConvertFrom-Json
          if ($scene.name -ne "ClipKit") { throw "Scene collection name is '$($scene.name)', expected 'ClipKit'" }
          Write-Host "dry-run profile verified"

      - name: Build ClipKit.exe
        run: python build.py

      - name: Upload ClipKit.exe
        uses: actions/upload-artifact@v4
        with:
          name: ClipKit
          path: dist/ClipKit.exe
          if-no-files-found: error

      - name: Attach ClipKit.exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipKit.exe
