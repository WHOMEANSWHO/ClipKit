name: Windows build & test

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke test - detect
        run: python clipkit.py --detect

      - name: Smoke test - write a ClipKit profile (dry run)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "clipkit-dryrun"
          python clipkit.py --dry-run "$dir"
          $required = @(
            "basic\profiles\ClipKit\basic.ini",
            "basic\scenes\ClipKit.json",
            "user.ini"
          )
          foreach ($rel in $required) {
            $p = Join-Path $dir $rel
            if (-not (Test-Path $p)) { throw "Missing expected profile file: $p" }
          }
          $scene = Get-Content (Join-Path $dir "basic\scenes\ClipKit.json") -Raw | ConvertFrom-Json
          if ($scene.name -ne "ClipKit") { throw "Scene collection name is '$($scene.name)', expected 'ClipKit'" }
          $basic = Get-Content (Join-Path $dir "basic\profiles\ClipKit\basic.ini") -Raw
          if ($basic -notmatch "VBitrate=\d+") { throw "basic.ini is missing a VBitrate value" }
          $log = Join-Path $env:APPDATA "ClipKit\clipkit.log"
          if (-not (Test-Path $log)) { throw "Diagnostics log was not written: $log" }
          Write-Host "dry-run profile + diagnostics log verified"

      - name: Build ClipKit.exe
        run: python build.py

      - name: Code-sign ClipKit.exe (only if a signing cert is configured)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret set — skipping code signing."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "clipkit-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on the runner." }
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\ClipKit.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }
          Remove-Item $pfx -Force
          & $signtool.FullName verify /pa dist\ClipKit.exe
          Write-Host "Signed dist\ClipKit.exe"

      - name: Upload ClipKit.exe
        uses: actions/upload-artifact@v4
        with:
          name: ClipKit
          path: dist/ClipKit.exe
          if-no-files-found: error

      - name: Attach ClipKit.exe to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipKit.exe
